  <!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <!-- Vinculamos el archivo de estilos CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>


    <div class="contenedor-principal">
        <div class="formulario-caja">
            <h1>Iniciar Sesión</h1>
            
            <form action="#" method="POST">
                <!-- Campo para el ID -->
                <div class="caja-input">
                    <label for="id">Nombre o Nick</label>
                    <input type="text" id="id" placeholder="Ingresa tu ID" required>
                </div>
                
                <!-- Campo para la Contraseña -->
                <div class="caja-input">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="Ingresa tu contraseña" required>
                </div>


 <!-- Enlace de registro -->
            <div class="enlace-registro">
                <a href="file:///D:/jose%20clemente%20maurer%206to%20A/Ariana/registro%20para%20mi%20innovacion%20Ariana.html">Registrarse</a>
            </div>

  <!-- Botón Ingresar -->
  <center>
                <button type="submit" class="boton-ingresar">Ingresar</button> </center>
            </form>

        </div>      
    
</body>
</html>
<style>
{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

/* Configuramos la imagen de fondo */
body {
    background-image: url('tu-imagen.jpg'); /* REEMPLAZA ESTO CON TU IMAGEN */
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* Contenedor principal que centra el formulario */
.contenedor-principal {
    display: flex;
    justify-content: center;
    align-items: center;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.5); /* Oscurece un poco el fondo para que el texto resalte */
}

/* Estilo de la caja del formulario */
.formulario-caja {
    background-color: rgba(255, 255, 255, 0.9);
    padding: 30px 40px;
    border-radius: 12px;
    width: 350px;
    box-shadow: 0 8px 16px rgba(0,0,0,0.3);
    position: relative; /* Permite posicionar elementos absolutamente dentro de esta caja */
}

/* Título */
.formulario-caja h1 {
    text-align: center;
    margin-bottom: 25px;
    color: #333;
}

/* Campos de entrada (ID y Contraseña) */
.caja-input {
    margin-bottom: 15px;
}

.caja-input label {
    display: block;
    margin-bottom: 5px;
    font-weight: bold;
    color: #333;
}

.caja-input input {
    width: 100%;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 16px;
}

/* Botón Ingresar */
.boton-ingresar {
    width: 50%;
    padding: 12px;
    background-color: #007bff;
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 18px;
    cursor: pointer;
    margin-top: 20px;
    transition: background-color 0.3s;
}

.boton-ingresar:hover {
    background-color: #0056b3;
}

/* Enlace Registrarse a la derecha*/
.enlace-registro {
    position:absolute;
    right: 30px;
    bottom: 20px;
}

.enlace-registro a {
    color: #007bff;
    text-decoration: none;
    font-size: 14px;
}

.enlace-registro a:hover {
    text-decoration: underline;
}
</style>
