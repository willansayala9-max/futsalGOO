function crearTarjeta(tecnica) {
  const tarjeta = document.createElement("article");
  tarjeta.className = "tarjeta";

  const imagen = document.createElement("div");
  imagen.className = "imagen";

  const foto = document.createElement("img");
  foto.src = tecnica.imagen;
  foto.alt = tecnica.nombre;

  foto.onerror = function() {
    foto.remove();
    imagen.textContent = "⚽ " + tecnica.nombre;
  };

  imagen.appendChild(foto);

  const contenido = document.createElement("div");
  contenido.className = "contenido";

  const titulo = document.createElement("h2");
  titulo.textContent = tecnica.nombre;

  const descripcion = document.createElement("p");
  descripcion.textContent = tecnica.descripcion;

  const pista = document.createElement("p");
  pista.className = "pista";
  pista.textContent = "Consejo: " + tecnica.pista;

  contenido.append(titulo, descripcion, pista);
  tarjeta.append(imagen, contenido);

  return tarjeta;
}

function normalizarPosicion(valor) {
  const texto = valor
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .trim();

  if (texto.includes("arquero") || texto.includes("portero")) {
    return "arquero";
  }

  if (texto.includes("cierre") || texto === "defensa") {
    return "cierre";
  }

  if (texto === "ala" || texto.includes("ala ")) {
    return "ala";
  }

  if (texto.includes("pivot")) {
    return "pívot";
  }

  return "sin posición definida";
}

const categoriaNormalizada = categoria
  .toUpperCase()
  .replace(/\s+/g, "")
  .replace(/SUB(\d+)/, "SUB-$1");

const posicionNormalizada = normalizarPosicion(posicion);

  // SUB-9: muestra las técnicas específicas de la posición elegida.
  todasLasTecnicas = tecnicasSub9[posicionNormalizada] ||

  // Otras categorías conservan el contenido que ya tenía la página.
  const tecnicasPorPosicion = {
    "arquero": tecnicasSub9["arquero"],
    "cierre": tecnicasSub9["cierre"],
    "ala": tecnicasSub9["ala"],
    "pívot": tecnicasSub9["pívot"]

}

const contenedor = document.getElementById("tarjetas");
contenedor.replaceChildren();

todasLasTecnicas.forEach(function(tecnica) {

});
